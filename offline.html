<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7C3AED" />
  <title>Offline — Chattify</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #0F0F1A; color: #F8F8FF;
      min-height: 100dvh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      text-align: center; max-width: 320px; width: 100%;
    }
    .icon-wrap {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(236,72,153,0.15));
      border: 1px solid rgba(139,92,246,0.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.3); }
      50%       { box-shadow: 0 0 0 16px rgba(139,92,246,0); }
    }
    .icon-wrap svg { color: #8B5CF6; }
    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 1.875rem; font-weight: 700;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 12px;
    }
    p {
      color: #A0A0B8; font-size: 0.9rem;
      line-height: 1.6; margin-bottom: 32px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 999px;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      color: #fff; font-weight: 600; font-size: 0.875rem;
      cursor: pointer; border: none; outline: none;
      font-family: inherit; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .dots { display: flex; gap: 6px; justify-content: center; margin-top: 40px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(139,92,246,0.4);
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-8px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 6s4-4 11-4 11 4 11 4"/>
        <path d="M5 10s2.5-2.5 7-2.5 7 2.5 7 2.5"/>
        <line x1="9" y1="14" x2="15" y2="14"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Don't worry — your messages are saved and will sync when you're back online.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Try Again
    </button>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <script>
    window.addEventListener('online', () => { window.location.href = '/'; });
  </script>
</body>
</html>
